# Publishes a reviewed release tag to TestPyPI or PyPI with trusted publishing
# (OpenID Connect): no API token is stored. Run it manually on a tag such as
# v0.2.2. The "pypi" environment should require a reviewer's approval.
name: Publish

on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index to publish to
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build and check the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require a release tag that matches the package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Run this workflow on tag v$version, not $REF_TYPE $REF_NAME."
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install "build==1.6.1" "twine==7.0.0"
          python -m build --outdir dist .
          python -m twine check --strict dist/*
      # Runs outside the checkout so packaged data, not repository files, is used.
      - name: Smoke-test the wheel in a clean virtual environment
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-venv/bin/python -m pip check
          wheel-venv/bin/circa --version
          wheel-venv/bin/circa analyze-log "$GITHUB_WORKSPACE/examples/demo_disk_full.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    if: inputs.index == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/circa-ci
    permissions:
      id-token: write # trusted publishing: exchanges a short-lived OIDC token for upload rights
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: inputs.index == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/circa-ci
    permissions:
      id-token: write # trusted publishing: exchanges a short-lived OIDC token for upload rights
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
