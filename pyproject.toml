[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circa"
version = "0.1.0"
description = "Continuous Integration Root Cause Analyzer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
circa = "circa.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.hatch.build.targets.wheel]
packages = ["src/circa"]

[tool.hatch.build.targets.wheel.force-include]
"src/circa/data/incidents.json" = "circa/data/incidents.json"
"src/circa/data/retrieval_evaluation.json" = "circa/data/retrieval_evaluation.json"
