[build-system]
# Pinned so release builds are reproducible.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
# "circa" on PyPI is an unrelated project; the command and import name stay "circa".
name = "circa-ci"
version = "0.3.0"
description = "Continuous Integration Root Cause Analyzer"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ci", "continuous-integration", "root-cause-analysis", "github-actions", "logs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/scmbuildrelease/CIRCA"
Changelog = "https://github.com/scmbuildrelease/CIRCA/blob/main/CHANGELOG.md"
Issues = "https://github.com/scmbuildrelease/CIRCA/issues"

[project.optional-dependencies]
# Linter, formatter, and type-checker versions are pinned so local runs match CI.
dev = [
    "mypy==2.4.0",
    "pytest>=8.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[project.scripts]
circa = "circa.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.coverage.run]
source = ["circa"]
branch = true

[tool.coverage.report]
# Baseline is 92% line+branch coverage; the floor catches meaningful drops.
fail_under = 90
show_missing = true

[tool.mypy]
files = ["src"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/circa"]

# Only what is needed to build and use CIRCA is distributed: no real team knowledge, tests,
# evaluation dataset, agent instructions, or CI configuration.
[tool.hatch.build.targets.sdist]
exclude = ["/team", "/tests", "/evaluation", "/AGENTS.md", "/.github"]

[tool.hatch.build.targets.wheel.force-include]
"src/circa/data/incidents.json" = "circa/data/incidents.json"
"src/circa/data/retrieval_evaluation.json" = "circa/data/retrieval_evaluation.json"
