[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circa"
version = "0.1.0"
description = "Continuous Integration Root Cause Analyzer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Linter, formatter, and type-checker versions are pinned so local runs match CI.
dev = [
    "mypy==2.4.0",
    "pytest>=8.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[project.scripts]
circa = "circa.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.coverage.run]
source = ["circa"]
branch = true

[tool.coverage.report]
# Baseline is 92% line+branch coverage; the floor catches meaningful drops.
fail_under = 90
show_missing = true

[tool.mypy]
files = ["src"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/circa"]

[tool.hatch.build.targets.wheel.force-include]
"src/circa/data/incidents.json" = "circa/data/incidents.json"
"src/circa/data/retrieval_evaluation.json" = "circa/data/retrieval_evaluation.json"
